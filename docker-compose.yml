services:
  backend:
    build:
      context: ./backend
    ports:
      - "8000:8000"
    environment:
      APP_ENV: development
      API_V1_PREFIX: /api/v1
      CORS_ORIGINS: http://localhost:8080
      OPENAI_API_KEY: ${OPENAI_API_KEY}

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_BASE_URL: http://localhost:8000/api/v1
    ports:
      - "8080:80"
    depends_on:
      - backend
